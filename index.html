<body>
<div class="app" id="app"><header class="topbar"><div class="brand">🌍 Countries and Nationalities</div><span class="pill">⭐ <strong id="score">0</strong></span><span class="pill">🔥 <strong id="streak">0</strong></span><button class="sound" id="soundBtn" aria-label="Toggle sound">🔊</button></header><div class="progress"><div id="progressFill"></div></div><main class="stage" id="stage"></main></div>
<script>
(()=>{'use strict';
const countries=[['Türkiye','Turkish','🇹🇷'],['England','English','england'],['USA','American','🇺🇸'],['Germany','German','🇩🇪'],['France','French','🇫🇷'],['Italy','Italian','🇮🇹'],['Greece','Greek','🇬🇷'],['Russia','Russian','🇷🇺'],['China','Chinese','🇨🇳'],['Japan','Japanese','🇯🇵'],['Iran','Iranian','🇮🇷'],['Iraq','Iraqi','🇮🇶'],['Pakistan','Pakistani','🇵🇰'],['Spain','Spanish','🇪🇸'],['Brazil','Brazilian','🇧🇷'],['Canada','Canadian','🇨🇦'],['Australia','Australian','🇦🇺']].map(([name,nationality,flag])=>({name,nationality,flag}));
const suffixCases=[['Austral','-ian','Australian'],['Turk','-ish','Turkish'],['Span','-ish','Spanish'],['Japan','-ese','Japanese'],['Chin','-ese','Chinese'],['Russ','-ian','Russian'],['Canad','-ian','Canadian'],['Brazil','-ian','Brazilian'],['Ital','-ian','Italian'],['Iran','-ian','Iranian'],['Germ','-an','German'],['Americ','-an','American'],['Iraq','-i','Iraqi'],['Pakistan','-i','Pakistani'],['Engl','-ish','English']].map(([stem,suffix,full])=>({stem,suffix,full}));
const stage=document.getElementById('stage'),scoreEl=document.getElementById('score'),streakEl=document.getElementById('streak'),progressEl=document.getElementById('progressFill');let audioCtx=null,sound=true,score=0,streak=0,best=0,level=0,index=0,order=[],locked=false,activeMini=null,timers=[],questionCorrect=0,gameEpoch=0;
function rnd(n){return Math.floor(Math.random()*n)}function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}function sample(arr,n){return shuffle(arr).slice(0,n)}function escapeHtml(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function flagHtml(c){return c.flag==='england'?'<svg class="flag" role="img" aria-label="England flag" viewBox="0 0 60 40" preserveAspectRatio="xMidYMid slice"><rect width="60" height="40" fill="white"/><path d="M25 0h10v40H25z M0 15h60v10H0z" fill="#ce2029"/></svg>':`<span class="flag emoji" role="img" aria-label="${escapeHtml(c.name)} flag">${c.flag}</span>`}
function setTimers(fn,ms){const id=setTimeout(fn,ms);timers.push(()=>clearTimeout(id));return id}function setRepeat(fn,ms){const id=setInterval(fn,ms);timers.push(()=>clearInterval(id));return id}function clearTimers(){timers.forEach(x=>x());timers=[];activeMini=null;gameEpoch++}function render(html){stage.innerHTML=`<div class="screen">${html}</div>`}function hud(){scoreEl.textContent=score;streakEl.textContent=streak;progressEl.style.width=level>0?`${(Math.min(51,(level-1)*17)+index)/66*100}%`:'0%'}
function tone(freq,dur=0.11,type='sine',vol=.08,delay=0){if(!sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function fanfare(){[392,523,659,784,1047].forEach((f,i)=>{tone(f,i===4?.38:.15,'sawtooth',.035,i*.105);tone(f/2,i===4?.35:.13,'triangle',.04,i*.105)})}function failSound(){tone(250,.17,'triangle',.08);tone(170,.26,'sawtooth',.035,.13)}function popSound(){tone(700,.06,'sine',.09);tone(980,.08,'triangle',.04,.06)}function speak(s){if(!sound||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s==='Türkiye'?'Turkey':s);u.lang='en-US';u.rate=.82;u.pitch=1.08;u.volume=1;window.speechSynthesis.speak(u)}
function particles(n=35){const app=document.getElementById('app');for(let i=0;i<n;i++){const el=document.createElement('i');el.className='particle';el.style.left=`${20+Math.random()*60}%`;el.style.top=`${15+Math.random()*38}%`;el.style.background=['#fff57f','#54eac0','#fd6fac','#9fb5ff','#fff'][rnd(5)];el.style.setProperty('--dx',`${(Math.random()-.5)*550}px`);el.style.setProperty('--dy',`${Math.random()*420-80}px`);el.style.setProperty('--rot',`${Math.random()*1100}deg`);el.style.borderRadius=Math.random()>.5?'50%':'2px';app.appendChild(el);setTimeout(()=>el.remove(),1050)}}function floatingStars(n=5){for(let i=0;i<n;i++){const s=document.createElement('span');s.className='starMini';s.textContent='⭐';s.style.left=`${30+Math.random()*40}%`;s.style.top=`${25+Math.random()*25}%`;document.getElementById('app').appendChild(s);setTimeout(()=>s.remove(),1100)}}function toast(msg){document.querySelectorAll('.toast').forEach(e=>e.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('app').appendChild(t);setTimeout(()=>t.remove(),850)}function addPoints(n){score+=n;hud()}
function landing(){clearTimers();document.body.dataset.level='0';level=0;index=0;hud();render(`<div class="heroIcons">🌍 ✨ 🎮</div><h1 class="title">Countries and<br>Nationalities</h1><p class="subtitle">🇹🇷 🇯🇵 🇫🇷 🇨🇦 🇧🇷</p><button class="primary" id="start">▶ START</button>`);document.getElementById('start').onclick=()=>{tone(523,.1);startLevel(1)}}
function startLevel(n){clearTimers();level=n;document.body.dataset.level=String(n);index=0;questionCorrect=0;order=shuffle(n===4?suffixCases:countries);locked=false;if(n===4)showSuffixQuestion();else showQuestion()}
function optsFor(correct){return shuffle([correct,...sample(countries.filter(x=>x!==correct),3)])}
function showQuestion(){clearTimers();locked=false;hud();if(index>=17){levelFinished();return}const correct=order[index],opts=optsFor(correct);const question=level===1?'Which country is this?':level===2?'🔊 Listen and choose!':`What nationality is ${Math.random()<.5?'he':'she'}?`;
const silhouette=`<div class="silhouette" aria-hidden="true"><svg viewBox="0 0 100 150"><circle cx="50" cy="31" r="23" fill="currentColor"/><path d="M20 149V103c0-29 14-39 30-39s30 10 30 39v46Z" fill="currentColor"/></svg></div>`;
const visual=level===3?`<div class="display"><div class="bigFlag">${flagHtml(correct)}</div>${silhouette}<span class="qmark">?</span></div>`:level===1?`<div class="bigFlag">${flagHtml(correct)}</div>`:`<button class="listen" id="listen" aria-label="Play country name">🔊 Play again</button>`;
const cards=opts.map((o,i)=>`<button class="answer ${level===2?'flagChoice':''}" data-choice="${i}" aria-label="${escapeHtml(level===2?o.name:level===3?o.nationality:o.name)}">${level===2?flagHtml(o):escapeHtml(level===3?o.nationality:o.name)}</button>`).join('');render(`<div class="eyebrow">LEVEL ${level} &nbsp;·&nbsp; ${index+1} / 17</div>${visual}<div class="question">${question}</div><div class="answers">${cards}</div><div class="feedback" id="feedback"></div>`);
if(level===2){document.getElementById('listen').onclick=()=>speak(correct.name);setTimers(()=>speak(correct.name),330)}
stage.querySelectorAll('[data-choice]').forEach(btn=>btn.onclick=()=>{if(locked)return;locked=true;const chosen=opts[Number(btn.dataset.choice)],isCorrect=chosen===correct;btn.classList.add(isCorrect?'correct':'wrong');if(!isCorrect){stage.querySelector(`[data-choice="${opts.indexOf(correct)}"]`).classList.add('correct');streak=0;failSound();document.getElementById('feedback').textContent='Try the next one!';}else{streak++;best=Math.max(best,streak);questionCorrect++;addPoints(10+Math.min(streak,10)*2);fanfare();if(level===3)setTimers(()=>speak(correct.nationality),160);floatingStars(3);if(streak%5===0){particles(30);toast(`🔥 ${streak} STREAK!`)}else document.getElementById('feedback').textContent='⭐ Amazing!';}hud();setTimers(()=>{index++;showQuestion()},isCorrect?850:1200)});
}
function levelFinished(){clearTimers();particles(50);fanfare();const total=level===4?suffixCases.length:17,stars=questionCorrect>=Math.ceil(total*.82)?'⭐⭐⭐':questionCorrect>=Math.ceil(total*.53)?'⭐⭐☆':'⭐☆☆';
if(level===4){render(`<div class="eyebrow">LEVEL 4 COMPLETE!</div><div class="resultStars">${stars}</div><div class="bigText">${questionCorrect} / ${total}</div><div class="heroIcons">🌍 🏆 🎉</div><button class="primary" id="results">SEE RESULTS ▶</button>`);document.getElementById('results').onclick=finalScreen;return}
const miniName=['','Space Dodge!','Catch the Flag!','Treasure Hunt!'][level];render(`<div class="eyebrow">LEVEL ${level} COMPLETE!</div><div class="resultStars">${stars}</div><div class="bigText">${questionCorrect} / ${total}</div><div class="subtitle">Bonus round unlocked!</div><div class="heroIcons">${level===1?'🚀':level===2?'🧺':'🎁'}</div><button class="primary" id="miniStart">${miniName} ▶</button>`);document.getElementById('miniStart').onclick=()=>{popSound();if(level===1)startSpace();else if(level===2)startCatch();else startTreasure()};}
function miniEnd(textMsg,bonus){clearTimers();if(bonus){addPoints(bonus);particles(48);fanfare()}render(`<div class="heroIcons">🏆 🌟</div><div class="bigText">${textMsg}</div><p class="subtitle">+${bonus} bonus points</p><button class="primary" id="next">NEXT LEVEL ▶</button>`);document.getElementById('next').onclick=()=>startLevel(level+1)}
function showSuffixQuestion(){clearTimers();locked=false;hud();if(index>=suffixCases.length){levelFinished();return}
const correct=order[index];const choices=shuffle([correct.suffix,...sample(['-ian','-ish','-ese','-an','-i'].filter(s=>s!==correct.suffix),3)]);
render(`<div class="eyebrow">LEVEL 4 &nbsp;·&nbsp; ${index+1} / ${suffixCases.length}</div><div class="question">Complete the nationality!</div><div class="suffixPrompt"><span class="wordStem">${correct.stem}</span><div class="suffixDrop" id="suffixDrop" aria-label="Drop suffix here">?</div></div><div class="suffixOptions">${choices.map((suffix,i)=>`<button class="suffixTile" data-suffix="${suffix}" aria-label="${suffix}">${suffix}</button>`).join('')}</div><div class="feedback" id="feedback"></div>`);
const drop=document.getElementById('suffixDrop'),tiles=[...stage.querySelectorAll('[data-suffix]')];let selected=null,ghost=null,drag=null;
function choose(suffix){if(locked)return;selected=suffix;tiles.forEach(t=>t.classList.toggle('selected',t.dataset.suffix===suffix));drop.textContent=suffix;drop.classList.remove('correct','wrong');popSound()}
function submit(suffix){if(locked)return;locked=true;selected=suffix;drop.textContent=suffix;const right=suffix===correct.suffix;drop.classList.add(right?'correct':'wrong');tiles.forEach(t=>t.disabled=true);
if(right){questionCorrect++;streak++;best=Math.max(best,streak);addPoints(12+Math.min(streak,10)*2);fanfare();floatingStars(4);document.getElementById('feedback').textContent='⭐ '+correct.full;setTimers(()=>speak(correct.full),150);if(streak%5===0){particles(36);toast(`🔥 ${streak} STREAK!`)}}
else{streak=0;failSound();document.getElementById('feedback').textContent=`${correct.stem}${correct.suffix} = ${correct.full}`;setTimers(()=>{drop.textContent=correct.suffix;drop.classList.remove('wrong');drop.classList.add('correct');speak(correct.full)},350)}hud();setTimers(()=>{index++;showSuffixQuestion()},right?1750:2150)}
// Tap-to-select / tap drop works for all devices; direct tap on a suffix also submits.
tiles.forEach(tile=>{let suppressClick=false;tile.addEventListener('click',()=>{if(suppressClick){suppressClick=false;return}submit(tile.dataset.suffix)});
tile.addEventListener('pointerdown',e=>{if(locked)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false,suffix:tile.dataset.suffix};tile.setPointerCapture?.(e.pointerId)});
tile.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId||locked)return;const d=Math.hypot(e.clientX-drag.x,e.clientY-drag.y);if(d>11){drag.moved=true;if(!ghost){ghost=document.createElement('div');ghost.className='suffixGhost';ghost.textContent=drag.suffix;document.body.appendChild(ghost)}ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';const r=drop.getBoundingClientRect();drop.classList.toggle('over',e.clientX>=r.left-15&&e.clientX<=r.right+15&&e.clientY>=r.top-15&&e.clientY<=r.bottom+15)}});
tile.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const wasMoved=drag.moved,suffix=drag.suffix;const r=drop.getBoundingClientRect(),inside=e.clientX>=r.left-20&&e.clientX<=r.right+20&&e.clientY>=r.top-20&&e.clientY<=r.bottom+20;if(ghost){ghost.remove();ghost=null}drop.classList.remove('over');drag=null;if(wasMoved){suppressClick=true;if(inside)submit(suffix);else choose(suffix)}});
tile.addEventListener('pointercancel',()=>{ghost?.remove();ghost=null;drop.classList.remove('over');drag=null})});
drop.addEventListener('click',()=>{if(selected&&!locked)submit(selected)});
}
function startSpace(){
 clearTimers();let secs=20,hits=0,misses=0,shipX=.5,keys={left:false,right:false},objects=[],last=0,spawnClock=0,frame=0,epoch=gameEpoch,invincibleUntil=0;
 render(`<div class="eyebrow">🚀 SPACE DODGE!</div><div class="miniStats"><span>⭐ <strong id="hits">0</strong></span><span>⏱ <strong id="miniTime">20</strong>s</span><span>💥 <strong id="damage">0</strong></span></div><div class="miniArena spaceArena" id="spaceArena"><div class="spaceStars"></div><div class="spaceship" id="spaceship" aria-label="Spaceship">🚀</div></div><div class="catchHint">Drag or use ← → · Catch stars, dodge asteroids!</div>`);
 const arena=document.getElementById('spaceArena'),ship=document.getElementById('spaceship');
 function move(x){const r=arena.getBoundingClientRect();shipX=Math.max(.07,Math.min(.93,(x-r.left)/r.width));ship.style.left=`${shipX*100}%`}
 arena.addEventListener('pointerdown',e=>{move(e.clientX);arena.setPointerCapture?.(e.pointerId)});
 arena.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons)move(e.clientX)});
 function keydown(e){if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){keys.left=true;e.preventDefault()}if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){keys.right=true;e.preventDefault()}}
 function keyup(e){if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false}
 window.addEventListener('keydown',keydown);window.addEventListener('keyup',keyup);timers.push(()=>{window.removeEventListener('keydown',keydown);window.removeEventListener('keyup',keyup)});
 function spawn(){const star=Math.random()<.60,el=document.createElement('div'),x=.06+Math.random()*.88;el.className=star?'spaceObject spaceStar':'spaceObject spaceRock';el.textContent=star?'⭐':'☄️';el.style.left=`${x*100}%`;el.style.top='-42px';arena.appendChild(el);objects.push({el,x,y:-.13,star,speed:.33+Math.random()*.15})}
 function loop(now){if(gameEpoch!==epoch||!arena.isConnected)return;const dt=Math.min(now-last||16,50);last=now;
  if(keys.left||keys.right){shipX=Math.max(.07,Math.min(.93,shipX+(Number(keys.right)-Number(keys.left))*dt*.0008));ship.style.left=`${shipX*100}%`}
  spawnClock+=dt;if(spawnClock>500){spawnClock=0;spawn()}
  const h=arena.clientHeight,w=arena.clientWidth;
  objects=objects.filter(o=>{o.y+=o.speed*dt/1000;o.el.style.top=`${o.y*h}px`;
   const dx=Math.abs((o.x-shipX)*w),dy=Math.abs((o.y-.84)*h);
   if(dx<35&&dy<31){o.el.remove();if(o.star){hits++;addPoints(15);popSound();floatingStars(1);document.getElementById('hits').textContent=hits}else if(now>invincibleUntil){misses++;invincibleUntil=now+650;failSound();document.getElementById('damage').textContent=misses;ship.classList.remove('shipHit');void ship.offsetWidth;ship.classList.add('shipHit')}return false}
   if(o.y>1.13){o.el.remove();return false}return true});frame=requestAnimationFrame(loop)
 }
 frame=requestAnimationFrame(loop);timers.push(()=>{cancelAnimationFrame(frame);objects.forEach(o=>o.el.remove())});
 setRepeat(()=>{secs--;const time=document.getElementById('miniTime');if(time)time.textContent=secs;if(secs<=0)miniEnd('Space explorer!',Math.max(0,hits*5-misses*5))},1000);
}
function startCatch(){clearTimers();let secs=20,hits=0,target=countries[rnd(countries.length)],items=[],last=0,spawnAt=0,frame=0,epoch=gameEpoch;render(`<div class="eyebrow">🧺 CATCH THE FLAG!</div><div class="miniStats"><span>Catch: <strong class="target" id="catchTarget"></strong></span><span>⏱ <strong id="miniTime">20</strong>s</span><span>⭐ <strong id="hits">0</strong></span></div><div class="miniArena" id="catchArena"><div class="basket" id="basket">⭐</div></div><div class="catchHint">Drag the basket or move your mouse</div>`);const arena=document.getElementById('catchArena'),basket=document.getElementById('basket');let basketX=.5;function move(x){const rect=arena.getBoundingClientRect();basketX=Math.min(.89,Math.max(.11,(x-rect.left)/rect.width));basket.style.left=`${basketX*100}%`}arena.addEventListener('pointermove',e=>{move(e.clientX)});arena.addEventListener('pointerdown',e=>{move(e.clientX);arena.setPointerCapture?.(e.pointerId)});function newTarget(){target=countries[rnd(countries.length)];document.getElementById('catchTarget').textContent=target.name;speak(target.name)}newTarget();function addItem(){const c=Math.random()<.45?target:countries[rnd(countries.length)];const el=document.createElement('div');el.className='catchFlag';el.innerHTML=flagHtml(c);arena.appendChild(el);items.push({c,el,x:.05+Math.random()*.81,y:-.2});}function loop(now){if(gameEpoch!==epoch||!arena.isConnected)return;const dt=Math.min((now-last)||16,45);last=now;spawnAt+=dt;if(spawnAt>=920){spawnAt=0;addItem()}const h=arena.clientHeight;items=items.filter(it=>{it.y+=dt/(h*4.6);it.el.style.left=`${it.x*100}%`;it.el.style.top=`${it.y*h}px`;if(it.y>.79&&it.y<.93&&Math.abs((it.x+.07)-basketX)<.13){if(it.c===target){hits++;addPoints(20);popSound();floatingStars(1);document.getElementById('hits').textContent=hits;newTarget()}else failSound();it.el.remove();return false}if(it.y>1){it.el.remove();return false}return true});frame=requestAnimationFrame(loop)}frame=requestAnimationFrame(loop);timers.push(()=>{cancelAnimationFrame(frame);items.forEach(it=>it.el.remove())});setRepeat(()=>{secs--;document.getElementById('miniTime').textContent=secs;if(secs<=0)miniEnd('Great catching!',hits*5)},1000)}
function startTreasure(){clearTimers();const reward=shuffle([100,150,200]);render(`<div class="eyebrow">🎁 TREASURE HUNT!</div><div class="bigText">Choose a treasure chest!</div><div class="treasures">${reward.map((_,i)=>`<button class="chest" data-chest="${i}" aria-label="Treasure chest ${i+1}">🎁</button>`).join('')}</div><p class="subtitle muted">Every chest has a surprise! ✨</p>`);let done=false;stage.querySelectorAll('[data-chest]').forEach(btn=>btn.onclick=()=>{if(done)return;done=true;const n=reward[Number(btn.dataset.chest)];btn.classList.add('opened');btn.textContent='💎';particles(95);fanfare();toast(`+${n} ⭐`);setTimers(()=>miniEnd('Treasure found!',n),1300)})}
function finalScreen(){clearTimers();progressEl.style.width='100%';const stars=score>=1100?'⭐⭐⭐':score>=650?'⭐⭐☆':'⭐☆☆';render(`<div class="eyebrow">MISSION COMPLETE</div><div class="heroIcons">🌍 🏆 🎉</div><h1 class="title">Fantastic!</h1><div class="resultStars">${stars}</div><div class="bigText">⭐ ${score} points</div><p class="subtitle">🔥 Best streak: ${best}</p><button class="primary" id="replay">↻ PLAY AGAIN</button>`);particles(95);fanfare();document.getElementById('replay').onclick=()=>{score=0;streak=0;best=0;landing()}}
document.getElementById('soundBtn').onclick=()=>{sound=!sound;document.getElementById('soundBtn').textContent=sound?'🔊':'🔇';if(!sound&&window.speechSynthesis)window.speechSynthesis.cancel()};window.addEventListener('keydown',e=>{if(e.key==='m'){document.getElementById('soundBtn').click();return}if(!locked&&level>0&&level<4&&stage.querySelectorAll('[data-choice]').length&&/^[1-4]$/.test(e.key)){stage.querySelectorAll('[data-choice]')[Number(e.key)-1]?.click()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&window.speechSynthesis)window.speechSynthesis.cancel()});landing();
})();
</script>
